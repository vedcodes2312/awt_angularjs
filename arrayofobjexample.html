<!DOCTYPE html>
<html lang="en" ng-app="myApp">
<head>
    <meta charset="UTF-8">
    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Angular JS ARRAY OF OBJECTS EXAMPLE</title>
</head>
<body ng-controller="myController">
    <h1 style="text-align: center;">List of Students </h1>
    <!-- display every element of array like we do using for loop -->
     <ul>
        <li ng-repeat="student in students"> {{student.name}}  {{student.age}} {{student.class}} </li>
     </ul>
    
     <script>
        // main angular js application
        var app = angular.module("myApp", []);  // [] for external module dependency

        // controller logic
        app.controller("myController",function($scope) {
            $scope.students=[
                {name: "John", age: 20, class: "A"},
                {name: "Mary", age: 22, class: "B"},
                {name: "Peter", age: 21, class: "C"},
                {name: "David", age: 23, class: "D"}
            ];
        });
     </script>
</body>
</html>
