<!DOCTYPE html>
<html lang="en" ng-app="myApp">
<head>
    <meta charset="UTF-8">
    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Angular JS http service</title>
</head>

<body ng-controller="myController">
    <h1><strong>HTTP SERVICE EXAMPLE IN ANGULAR JS WITH EXTERNAL SERVICE</strong></h1>
    <ul>
        <li ng-repeat="user in users"> {{user.name}} - {{user.email}} </li>
    </ul>

    <div ng-if="isloading">Loading data...</div>
        <div ng-if="error">{{error}}</div>
        <button ng-click="refreshData()">Refresh Data</button>

    <!-- custom controller sample-->
    <div ng-controller="myControllerWithService">
        <h2>Data fetched using custom service:</h2>
        <ul>
            <li ng-repeat="user in users"> {{user.name}} - {{user.email}} </li>
        </ul>
        <div ng-if="isloading">Loading data...</div>
        <div ng-if="error">{{error}}</div>
    </div>
    
        <!-- controller logic-->
   <script>
       var app = angular.module("myApp", []);  // [] for external module dependency
         app.controller("myController", function($scope, $http) {
                $scope.users = [];
                $scope.isloading = true; // Flag to indicate loading state
                $scope.error = null; // Variable to store error message
                $http.get("https://jsonplaceholder.typicode.com/users")
                 .then(function(response) {
                      $scope.users = response.data;
                      $scope.isloading = false; // Set loading state to false after data is fetched
                 })
                 .catch(function(error) {
                      $scope.error = "Error fetching data. Please try again later.";
                      $scope.isloading = false; // Set loading state to false even if there's an error
                      console.error("Error fetching data:", error);
                 });

                 // Function to refresh data
                $scope.refreshData = function() {
                        $scope.isloading = true; // Set loading state to true before fetching data
                        $scope.error = null; // Clear any previous error message
                        $http.get("https://jsonplaceholder.typicode.com/users")
                        .then(function(response) {
                                $scope.users = response.data;
                                $scope.isloading = false; // Set loading state to false after data is fetched
                        })
                        .catch(function(error) {
                                $scope.error = "Error fetching data. Please try again later.";
                                $scope.isloading = false; // Set loading state to false even if there's an error
                                console.error("Error fetching data:", error);
                    });
                };

          });
          // http has attributes like method,url,headers,data etc. we can use them to send data to server and get data from server

          // custom servine logic example
          app.service("myService", function($http) {
                this.getData = function() {
                    return $http.get("https://jsonplaceholder.typicode.com/users");
                };
          });

          app.controller("myControllerWithService", function($scope, myService) {
                $scope.users = [];
                $scope.isloading = true; // Flag to indicate loading state
                $scope.error = null; // Variable to store error message
                myService.getData()
                 .then(function(response) {
                      $scope.users = response.data;
                      $scope.isloading = false; // Set loading state to false after data is fetched
                 })
                 .catch(function(error) {
                      $scope.error = "Error fetching data. Please try again later.";
                      $scope.isloading = false; // Set loading state to false even if there's an error
                      console.error("Error fetching data:", error);
                 });
          });
   </script>
</body>
