<!DOCTYPE html>
<html lang="en" ng-app="myApp">
<head>
    <meta charset="UTF-8">
    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Example</title>
</head>

<body ng-controller="formController">
    <h1><strong>Form Example Using Angular JS</strong></h1>
    <form name="myForm" ng-submit="submitForm()">
        <label for="name">Name:</label>
        <input type="text" id="name" ng-model="user.name" required>
        <br><br>

        <label for="email">Email:</label>
        <input type="email" id="email" ng-model="user.email" required>
        <br><br>

        <label for="age">Age:</label>
        <input type="number" id="age" ng-model="user.age" required>
        <br><br>

        <button type="submit">Submit</button>
    </form>
     <!-- controller logic-->
      <script>
        var app = angular.module("myApp", []);  // [] for external module dependency
        app.controller("formController", function($scope) {
            $scope.user = {};

            $scope.submitForm = function() {
                if ($scope.myForm.$valid) {
                    console.log("Form submitted successfully!");
                    console.log("Name: " + $scope.user.name);
                    console.log("Email: " + $scope.user.email);
                    console.log("Age: " + $scope.user.age);
                } else {
                    console.log("Form is invalid. Please fill out all required fields.");
                }
            }
        });
      </script>

</body>
